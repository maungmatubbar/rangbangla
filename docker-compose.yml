name: rangbangla

services:
    # ---------------------------------------------------------------------------
    # PHP-FPM application container. Runs the automatic setup on first boot
    # (composer install if needed, key:generate, waits for MySQL, migrates).
    # ---------------------------------------------------------------------------
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: rangbangla/app
        container_name: rangbangla-app
        restart: unless-stopped
        working_dir: /var/www/html
        environment:
            CONTAINER_ROLE: app
            DB_HOST: mysql
            DB_PORT: 3306
            REDIS_HOST: redis
            REDIS_PORT: 6379
        volumes:
            - .:/var/www/html
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zzz-app.ini:ro
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # ---------------------------------------------------------------------------
    # Nginx web server. Serves /public and proxies PHP requests to app:9000.
    # ---------------------------------------------------------------------------
    nginx:
        image: nginx:1.27-alpine
        container_name: rangbangla-nginx
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8000}:80'
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    # ---------------------------------------------------------------------------
    # MySQL database.
    # ---------------------------------------------------------------------------
    mysql:
        image: mysql:8.0
        container_name: rangbangla-mysql
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-laravel}
            MYSQL_USER: ${DB_USERNAME:-laravel}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
            MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
        volumes:
            - mysql-data:/var/lib/mysql
            - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    'localhost',
                    '-u',
                    'root',
                    '-p${DB_ROOT_PASSWORD:-root}',
                ]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

    # ---------------------------------------------------------------------------
    # Redis (used for cache, sessions and queues).
    # ---------------------------------------------------------------------------
    redis:
        image: redis:7-alpine
        container_name: rangbangla-redis
        restart: unless-stopped
        command: ['redis-server', '--appendonly', 'yes']
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 20

    # ---------------------------------------------------------------------------
    # phpMyAdmin. Log in with the DB user (laravel/secret) or root (root/root).
    # ---------------------------------------------------------------------------
    phpmyadmin:
        image: phpmyadmin:5.2
        container_name: rangbangla-phpmyadmin
        restart: unless-stopped
        ports:
            - '${PMA_PORT:-8080}:80'
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            UPLOAD_LIMIT: 256M
        depends_on:
            mysql:
                condition: service_healthy

    # ---------------------------------------------------------------------------
    # Vite dev server with HMR. Assets are served from http://localhost:5173.
    # Uses the app image (PHP + Node) because the Wayfinder/Inertia Vite plugins
    # invoke `php artisan` during dev. The setup entrypoint is bypassed.
    # ---------------------------------------------------------------------------
    vite:
        image: rangbangla/app
        container_name: rangbangla-vite
        restart: unless-stopped
        working_dir: /var/www/html
        entrypoint: ['sh', '-c']
        command: ['npm install && npm run dev']
        environment:
            DOCKER: 'true'
            DB_HOST: mysql
            DB_PORT: 3306
            REDIS_HOST: redis
            REDIS_PORT: 6379
        ports:
            - '${VITE_PORT:-5173}:5173'
        volumes:
            - .:/var/www/html
            - node_modules:/var/www/html/node_modules
        depends_on:
            - app

    # ---------------------------------------------------------------------------
    # Queue worker (Redis-backed).
    # ---------------------------------------------------------------------------
    queue:
        image: rangbangla/app
        container_name: rangbangla-queue
        restart: unless-stopped
        working_dir: /var/www/html
        command: php artisan queue:work --tries=3 --timeout=90 --sleep=1
        environment:
            CONTAINER_ROLE: worker
            DB_HOST: mysql
            DB_PORT: 3306
            REDIS_HOST: redis
            REDIS_PORT: 6379
        volumes:
            - .:/var/www/html
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zzz-app.ini:ro
        depends_on:
            app:
                condition: service_started
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # ---------------------------------------------------------------------------
    # Scheduler (runs due scheduled tasks every minute).
    # ---------------------------------------------------------------------------
    scheduler:
        image: rangbangla/app
        container_name: rangbangla-scheduler
        restart: unless-stopped
        working_dir: /var/www/html
        command: php artisan schedule:work
        environment:
            CONTAINER_ROLE: worker
            DB_HOST: mysql
            DB_PORT: 3306
            REDIS_HOST: redis
            REDIS_PORT: 6379
        volumes:
            - .:/var/www/html
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zzz-app.ini:ro
        depends_on:
            app:
                condition: service_started
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

volumes:
    mysql-data:
    redis-data:
    node_modules:
