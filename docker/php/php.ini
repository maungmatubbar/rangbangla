; Custom PHP settings for the application container (development-friendly).
memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 120

; OPcache: keep timestamp validation on so code changes are picked up in dev.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
